<style>
  :root{
    --red: #C11526;
    --red-dark: #8E0F1C;
    --paper: #FBF9F7;
    --ink: #201C1B;
    --grey: #6E7679;
    --line: #ECE6E1;
    --white: #FFFFFF;
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    min-height:100vh;
    background: var(--paper);
    background-image: radial-gradient(circle at 15% 8%, #f2e9e4 0%, var(--paper) 45%);
    font-family: 'Poppins', sans-serif;
    color: var(--ink);
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding: 32px 16px 60px;
  }

  .card{
    width:100%;
    max-width: 400px;
    background: var(--white);
    border-radius: 22px;
    overflow:hidden;
    box-shadow: 0 30px 60px -25px rgba(32,28,27,0.35);
    position:relative;
  }

  .hero{
    position:relative;
    aspect-ratio: 775 / 457;
    overflow:hidden;
  }
  .hero img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }

  .rail{
    position:absolute;
    top:0; right:0;
    width:34px;
    height:100%;
    background: var(--red);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:2;
  }
  .rail span{
    writing-mode: vertical-rl;
    transform: rotate(180deg);
    color:var(--white);
    font-size:11.5px;
    font-weight:700;
    letter-spacing:2.5px;
    white-space:nowrap;
  }

  .id-block{
    padding: 26px 30px 6px;
  }
  .id-block h1{
    margin:0;
    font-size: 27px;
    font-weight:800;
    color: var(--red);
    line-height:1.15;
  }
  .id-block .role{
    font-family:'Caveat', cursive;
    font-weight:600;
    font-size: 22px;
    color: var(--grey);
    margin-top:2px;
  }

  .divider{
    height:1px;
    background: var(--line);
    margin: 18px 30px 4px;
  }

  .save-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    margin: 16px 30px 4px;
    padding: 13px 14px;
    background: var(--ink);
    color: var(--white);
    border:none;
    border-radius: 12px;
    font-family:'Poppins',sans-serif;
    font-weight:600;
    font-size: 14.5px;
    cursor:pointer;
    width: calc(100% - 60px);
    transition: transform .15s ease, background .2s ease;
  }
  .save-btn:hover{ background: var(--red-dark); }
  .save-btn:active{ transform: scale(0.98); }
  .save-btn svg{ width:17px; height:17px; flex-shrink:0; }

  .actions{
    display:flex;
    flex-direction:column;
    gap:10px;
    padding: 18px 30px 12px;
  }

  .action{
    display:flex;
    align-items:center;
    gap:14px;
    padding: 12px 14px;
    border-radius: 14px;
    border: 1.4px solid var(--line);
    text-decoration:none;
    color: var(--ink);
    transition: border-color .18s ease, background .18s ease, transform .15s ease;
  }
  .action:hover{ border-color: var(--red); background: #FDF4F4; }
  .action:active{ transform: scale(0.98); }

  .icon{
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: 1.6px solid var(--red);
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }
  .icon svg{ width:18px; height:18px; }
  .icon.filled{
    background: var(--red);
    border-color: var(--red);
  }

  .action .label{
    display:flex;
    flex-direction:column;
    line-height:1.25;
  }
  .action .label b{
    font-size: 14.5px;
    font-weight:600;
  }
  .action .label span{
    font-size: 12.5px;
    color: var(--grey);
  }

  .whatsapp .icon{ background: var(--red); border-color: var(--red); }

  footer{
    padding: 4px 0 0;
  }
  footer img{
    display:block;
    width:100%;
    height:auto;
  }

  @media (max-width: 380px){
    .id-block{ padding: 22px 22px 4px; }
    .divider{ margin: 16px 22px 4px; }
    .save-btn{ margin: 14px 22px 4px; width: calc(100% - 44px); }
    .actions{ padding: 16px 22px 10px; }
    footer{ padding: 4px 0 0; }
  }
</style>
</head>
